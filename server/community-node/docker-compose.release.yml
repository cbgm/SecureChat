x-hardened-service: &hardened-service
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-auto-update: &auto-update
  labels:
    com.centurylinklabs.watchtower.enable: "true"

services:
  mailbox-database:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/mailbox-database-password
    secrets:
      - mailbox-database-password
    networks:
      - backend

  mailbox:
    <<:
      - *hardened-service
      - *auto-update
    image: ${SECURECHAT_IMAGE_PREFIX:?Missing SECURECHAT_IMAGE_PREFIX}-mailbox:${SECURECHAT_IMAGE_TAG:?Missing SECURECHAT_IMAGE_TAG}
    build: !reset null
    ports: !reset []
    environment:
      TRUST_PROXY_HEADERS: "true"
      MAILBOX_DATABASE_PASSWORD: !reset null
      MAILBOX_DATABASE_PASSWORD_FILE: /run/secrets/mailbox-database-password
    secrets:
      - mailbox-database-password
    networks:
      - edge
      - backend

  federation-database:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/federation-database-password
    secrets:
      - federation-database-password
    networks:
      - backend

  federation:
    <<:
      - *hardened-service
      - *auto-update
    image: ${SECURECHAT_IMAGE_PREFIX:?Missing SECURECHAT_IMAGE_PREFIX}-federation:${SECURECHAT_IMAGE_TAG:?Missing SECURECHAT_IMAGE_TAG}
    build: !reset null
    ports: !reset []
    environment:
      TRUST_PROXY_HEADERS: "true"
      FEDERATION_DATABASE_PASSWORD: !reset null
      FEDERATION_DATABASE_PASSWORD_FILE: /run/secrets/federation-database-password
      FEDERATION_INTERNAL_API_TOKEN: !reset null
      FEDERATION_INTERNAL_API_TOKEN_FILE: /run/secrets/federation-internal-api-token
      GATEWAY_INTERNAL_API_TOKEN: !reset null
      GATEWAY_INTERNAL_API_TOKEN_FILE: /run/secrets/gateway-internal-api-token
    secrets:
      - federation-database-password
      - federation-internal-api-token
      - gateway-internal-api-token
    networks:
      - edge
      - backend

  gateway:
    <<:
      - *hardened-service
      - *auto-update
    image: ${SECURECHAT_IMAGE_PREFIX:?Missing SECURECHAT_IMAGE_PREFIX}-gateway:${SECURECHAT_IMAGE_TAG:?Missing SECURECHAT_IMAGE_TAG}
    build: !reset null
    ports: !reset []
    environment:
      FEDERATION_INTERNAL_API_TOKEN: !reset null
      FEDERATION_INTERNAL_API_TOKEN_FILE: /run/secrets/federation-internal-api-token
      GATEWAY_INTERNAL_API_TOKEN: !reset null
      GATEWAY_INTERNAL_API_TOKEN_FILE: /run/secrets/gateway-internal-api-token
    secrets:
      - federation-internal-api-token
      - gateway-internal-api-token
    networks:
      - edge
      - backend

  updater:
    image: ghcr.io/containrrr/watchtower:1.7.1
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: ${SECURECHAT_UPDATE_INTERVAL_SECONDS:-300}
      WATCHTOWER_ROLLING_RESTART: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - edge

networks:
  edge:
  backend:
    internal: true

secrets:
  mailbox-database-password:
    file: ${MAILBOX_DATABASE_PASSWORD_FILE:?Missing MAILBOX_DATABASE_PASSWORD_FILE}
  federation-database-password:
    file: ${FEDERATION_DATABASE_PASSWORD_FILE:?Missing FEDERATION_DATABASE_PASSWORD_FILE}
  federation-internal-api-token:
    file: ${FEDERATION_INTERNAL_API_TOKEN_FILE:?Missing FEDERATION_INTERNAL_API_TOKEN_FILE}
  gateway-internal-api-token:
    file: ${GATEWAY_INTERNAL_API_TOKEN_FILE:?Missing GATEWAY_INTERNAL_API_TOKEN_FILE}
